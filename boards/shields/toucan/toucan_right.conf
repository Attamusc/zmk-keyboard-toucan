CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# DEBUG: idle sleeper disabled because the entire trackpad path is disabled
# in the overlay. With no Pinnacle device bound, the idle sleeper would just
# skip every callback anyway, but commenting it out makes the intent obvious.
# Revert this commit to restore normal operation.
# CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# DEBUG: shortened from 3600000 (60 min) to 120000 (2 min) so the USB current
# meter test can observe SYSTEM_OFF behavior in a few minutes instead of an
# hour. Revert before going back to daily use — short timeout means BLE
# re-pair (2-5 sec) after every short break, which is annoying.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=120000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we 
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the cirque driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y

# DEBUG: USB CDC ACM logging so we can observe ZMK state transitions during
# the USB-current-meter test. Watch the serial console for:
#   - `activity: Setting state to idle`   (~30s after last input)
#   - `activity: Setting state to sleep`  (~2min after last input, per the
#     shortened CONFIG_ZMK_IDLE_SLEEP_TIMEOUT above)
# If state transitions fire but current stays high, the SoC isn't honoring
# the sleep requests = hardware-level fault. If they never fire, something
# is constantly resetting the activity timer.
#
# Revert before going back to daily use. The CDC ACM driver itself adds
# ~5-10 mA to the baseline so absolute current readings will be higher with
# this enabled.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
