CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter normal idle after 30 seconds and deep sleep after 60 minutes.
# See https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Change the style of the status screen. Available options: 0, 1, 2, 3
CONFIG_TOUCAN_STATUS_SCREEN=3

CONFIG_INPUT_THREAD_STACK_SIZE=2048
